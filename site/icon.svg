      <stop offset="0" stop-color="#ff3b5c"/>
      <stop offset="0.2" stop-color="#ffb02e"/>
      <stop offset="0.4" stop-color="#f5ff5a"/>
      <stop offset="0.55" stop-color="#5dff8f"/>
      <stop offset="0.7" stop-color="#39d4ff"/>
      <stop offset="0.85" stop-color="#3d5bff"/>
